name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release and sync jobs raise what they need
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # superseded branch runs are cancelled, release runs are never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # the tools run with uvx are pinned, dependabot does not update them
  TOX_VERSION: "4.64.5"
  TOX_UV_VERSION: "1.36.0"
  TWINE_VERSION: "7.0.0"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # tox-uv prefers the interpreters of the system; the tests run with the
      # standalone interpreter uv manages, whose libpython is put on the
      # library search path below
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        # `py` (or none, as in the entries below) runs the environment of the
        # python version, e.g. `py3.14`; another value runs that environment
        tox-env: [py]
        # Linux covers the full range with simulation support; Windows and
        # macOS cover only its newest version, 3.14. A core-only 3.15 job on
        # Linux is added below.
        exclude:
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
        # Keep the full suite on 3.14 while libroadrunner lacks 3.15 wheels.
        include:
          - os: ubuntu-latest
            python-version: "3.15"
          # the suite against the lower bounds of the dependencies, see the
          # `lowest` environment of tox.ini, which is pinned to python 3.12
          - os: ubuntu-latest
            python-version: "3.12"
            tox-env: lowest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.21"
        python-version: ${{ matrix.python-version }}
        # a release run restores no cache, which zizmor cannot tell from the
        # expression; the distributions are built without one, see `build`
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
    - name: Put libpython on the library search path (linux only)
      # the extension of libroadrunner links against libpython3.X.so.1.0. The
      # standalone interpreters of uv ship it in their `lib` directory but are
      # linked statically and never load it, so without this the import of
      # roadrunner fails. tox passes LD_LIBRARY_PATH on to the tests.
      if: runner.os == 'Linux'
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        uv python install "$PYTHON_VERSION"
        prefix="$("$(uv python find --no-project "$PYTHON_VERSION")" -c 'import sys; print(sys.base_prefix)')"
        echo "LD_LIBRARY_PATH=${prefix}/lib" >> "$GITHUB_ENV"
      shell: bash
    - name: Test with tox
      env:
        TOX_ENV: ${{ matrix.tox-env != 'py' && matrix.tox-env || format('py{0}', matrix.python-version) }}
      run: uvx --with "tox-uv==${TOX_UV_VERSION}" "tox@${TOX_VERSION}" -e "${TOX_ENV}"
      shell: bash

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix: $RESULT"
        test "$RESULT" = "success"

  cobra:
    # the tests which need cobrapy, the optional `cobra` extra, see the `cobra`
    # environment of tox.ini. They skip in every other environment, so this job
    # is the only place they run. It informs and does not gate: it is
    # deliberately not part of the `tests` job the branch protection requires,
    # since the package itself works without cobrapy.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # the interpreter uv manages, see the `test` job
      UV_PYTHON_PREFERENCE: only-managed

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      # the `cobra` environment is pinned to python 3.14, see tox.ini
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.21"
        python-version: "3.14"
        # a release run restores no cache, which zizmor cannot tell from the
        # expression; the distributions are built without one, see `build`
        enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}  # zizmor: ignore[cache-poisoning]
    - name: Put libpython on the library search path
      # the extension of libroadrunner links against libpython, see the `test` job
      run: |
        uv python install 3.14
        prefix="$("$(uv python find --no-project 3.14)" -c 'import sys; print(sys.base_prefix)')"
        echo "LD_LIBRARY_PATH=${prefix}/lib" >> "$GITHUB_ENV"
      shell: bash
    - name: Test with tox
      run: uvx --with "tox-uv==${TOX_UV_VERSION}" "tox@${TOX_VERSION}" -e cobra

  build:
    # builds the distributions of a release without any write permission; the
    # jobs which publish them only download what was built here
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      with:
        version: "0.12.21"
        python-version: "3.14"
        # a release is built from a clean state, never from a restored cache
        enable-cache: false
    - name: Check the release notes exist
      # found here rather than in `github-release`, which runs after the upload to PyPI
      run: test -f "release-notes/${GITHUB_REF_NAME}.md"
    - name: Build the package
      # --no-sources: built the way a user builds it, without uv specific sources
      run: uv build --no-sources
    - name: Check the package
      run: uvx "twine@${TWINE_VERSION}" check --strict dist/*
    - name: Upload the distributions
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    # the only job which can publish to PyPI, by trusted publishing through the
    # `pypi` environment; nothing is checked out and nothing is built here
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sbmlutils
    permissions:
      id-token: write  # trusted publishing to PyPI
    steps:
    - name: Download the distributions
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: dist
        path: dist/
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      with:
        packages-dir: dist/
        # PEP 740 attestations, signed with the identity of this workflow
        attestations: true

  github-release:
    # created once the package is on PyPI
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Create GitHub release
      # the GitHub cli of the runner, no third party action gets write access
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: >-
        gh release create "$TAG"
        --repo "$GITHUB_REPOSITORY"
        --verify-tag
        --title "$TAG"
        --notes-file "release-notes/${TAG}.md"

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: [publish, github-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
        # the push below needs the credentials, nothing else runs in this job
        persist-credentials: true
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
