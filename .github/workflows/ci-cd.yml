name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release and sync jobs raise what they need
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # superseded branch runs are cancelled, release runs are never cancelled
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # linux covers the full range, windows and macos only the newest version
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install the python dev files (linux only)
      # the extension of libroadrunner links against libpython, which the
      # standalone interpreters do not put on the library search path
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python${{ matrix.python-version }}-dev
        fi
      shell: bash
    - name: Install uv and set the python version
      # astral-sh/setup-uv publishes no floating major tag beyond v7
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Test with tox
      run:
        uvx --with tox-uv tox -e py${{ matrix.python-version }}

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix: $RESULT"
        test "$RESULT" = "success"

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/sbmlutils
    permissions:
      id-token: write  # trusted publishing to PyPI
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Build package
      run: uvx hatch build
    - name: Check the package
      run: uvx twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: "release-notes/${{ github.ref_name }}.md"
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@v7
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
