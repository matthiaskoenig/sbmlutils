name: documentation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # never cancel a running deployment, it would leave the site half published
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Build the documentation
        # the API reference is rendered from the docstrings by mkdocstrings,
        # so the package has to be importable
        run: uv run zensical build --clean
      - name: Generate the agent facing files
        # llms.txt, llms-full.txt and the markdown of every page
        run: uv run python scripts/llms_txt.py
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    # only the default branch publishes to https://matthiaskoenig.github.io/sbmlutils
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
