[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbmlutils"
dynamic = ["version"]
description = "sbmlutils are python utilities for working with SBML."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"}
]
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"SBML",
	"Systems Biology Markup Language",
	"COMBINE",
	"standardization",
	"computational modeling",
]
dependencies = [
	# SBML
	"python-libsbml>=5.21.1",
	"antimony>=3.1.3",
	"pymetadata>=0.6.0",
	# data structures, units and output
	"pydantic>=2.13.5",
	"pint>=0.25.3",
	"numpy>=2.2.2",
	"pandas>=2.2.0",
	"rich>=15.0.0",
	# model reports, notes and converters
	"lxml>=6.0.0",
	"jinja2>=3.1.6",
	"markdown-it-py>=4.2.0",
	"xmltodict>=1.0.2",
	# annotation spreadsheets, visualization
	"openpyxl>=3.1.5",
	"requests>=2.34.2",
]

[project.optional-dependencies]
# flux balance analysis of a model, see `sbmlutils.fbc.cobra`
cobra = [
	"cobra>=0.32.1",
]
# visualization of a model in a running Cytoscape, see `sbmlutils.cytoscape`
cytoscape = [
	"py4cytoscape>=1.13.0",
]
# simulation and plotting; the package itself does neither, the examples do
examples = [
	"libroadrunner>=2.10.0",
	"matplotlib>=3.11.1",
]
dev = [
	"sbmlutils[cytoscape,examples]",
	"bump-my-version>=1.5.1",
	"ruff>=0.16.6",
	"pre-commit>=4.6.2",
	"ty>=0.0.78",
	"tox>=4.61.2",
	"pytest>=9.1.1",
	"pytest-cov>=7.1.0",
	"zensical>=0.0.59",
	"mkdocstrings-python>=2.0.8",
]

[project.urls]
Homepage = "https://matthiaskoenig.github.io/sbmlutils"
Documentation = "https://matthiaskoenig.github.io/sbmlutils"
Repository = "https://github.com/matthiaskoenig/sbmlutils"
Issues = "https://github.com/matthiaskoenig/sbmlutils/issues"
Changelog = "https://github.com/matthiaskoenig/sbmlutils/tree/develop/release-notes"
Download = "https://pypi.org/project/sbmlutils"

[tool.hatch.version]
path = "./src/sbmlutils/__init__.py"

[tool.hatch.build]
# large test data, only needed from a checkout of the repository: the models of
# the SBML test suite (56 MB) and the biomodels archives (21 MB), which
# `sbmlutils.biomodels` downloads
exclude = [
    "src/sbmlutils/resources/models/sbml-test-suite-3.4.0",
    "src/sbmlutils/resources/models/biomodels",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sbmlutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# the package lives in the src layout, the examples are a package at the root of
# the repository; the checked python version is inferred from
# `project.requires-python` (i.e. the oldest supported version)
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests", "examples"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
