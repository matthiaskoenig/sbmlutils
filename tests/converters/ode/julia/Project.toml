# The julia environment of the generated julia code and its tests: the packages the
# code uses, with the major versions it is tested with, see the `julia` environment
# of tox.ini and the `julia` job of .github/workflows/ci-cd.yml. Install it with
# `julia --project=tests/converters/ode/julia -e 'using Pkg; Pkg.instantiate()'`.
[deps]
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
NaNMath = "77ba4419-2d1f-58cd-9bb1-8ffee604a2e3"
OrdinaryDiffEq = "1dea7af3-3e70-54e6-95c3-0bf5283fa5ed"
SpecialFunctions = "276daf66-3868-5448-9aa4-cd146d93841b"

[compat]
DataFrames = "1.6"
NaNMath = "1"
OrdinaryDiffEq = "7"
SpecialFunctions = "2"
julia = "1.10"
