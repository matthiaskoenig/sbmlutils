[tox]
envlist = ty, py3.{11,12,13,14}

[testenv]
package = wheel
wheel_build_env = .pkg
# the examples simulate and plot, the package itself does neither
extras =
    examples
deps =
    pytest
commands =
    pytest

[testenv:ty]
# the examples simulate and plot, and `sbmlutils.cytoscape` imports
# py4cytoscape, all of them have to resolve for the type check
extras =
    cytoscape
    examples
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check
