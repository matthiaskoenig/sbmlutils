[tox]
envlist = ty, cobra, lowest, py3.{11,12,13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
# the examples simulate and plot, the package itself does neither
extras =
    examples
# typst compiles the typst of the ODE export in the tests, it is no dependency of
# the package (part of the `dev` extra)
deps =
    pytest
    typst>=0.15.0
# what follows `--` is passed to pytest, so that `tox r -e py3.14 --
# tests/test_factory.py` runs one module in the environment; without it the
# whole suite runs, which is what continuous integration does
commands =
    pytest -m "not sbml_testsuite" {posargs}

[testenv:py3.15]
# libroadrunner has no CPython 3.15 wheels yet. Test the core package while
# simulation tests skip; older Python environments still run the full suite.
extras =
deps =
    pytest
    matplotlib>=3.11.1
    # an abi3 wheel, which installs on CPython 3.15
    typst>=0.15.0

[testenv:ty]
# the examples simulate and plot, and `sbmlutils.cytoscape` imports
# py4cytoscape, all of them have to resolve for the type check
extras =
    cytoscape
    examples
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check

[testenv:cobra]
# the tests which need cobrapy, the optional `cobra` extra: the fbc semantics
# of `tests/test_package_semantics.py`, which reads a model and its round trip
# as two constraint based models, and `tests/fbc/test_cobra.py`. Both skip when
# cobrapy is absent, so without this environment they would skip everywhere and
# verify nothing. The environments above deliberately do not install it: the
# package works without it, and the type check is run against a tree in which
# it is missing. `examples` is needed as well, the comp semantics of the same
# module simulate with roadrunner.
#
# cobrapy 0.32.1 and its glpk solver install and run on python 3.14, which this
# environment is pinned to. It is part of `envlist`, which requires 3.14 already.
basepython = python3.14
extras =
    cobra
    examples
deps =
    pytest
    typst>=0.15.0
# what follows `--` replaces the two modules below, so that
# `tox r -e cobra -- tests/fbc/test_cobra.py` runs that one
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/test_package_semantics.py tests/fbc/test_cobra.py}

[testenv:lowest]
# the lower bounds of `pyproject.toml` are a promise to every user who installs
# sbmlutils next to other packages: this environment installs the oldest
# version each of them allows (`lowest-direct`, the dependencies of those stay
# at their newest) on the oldest supported python and runs the suite against it
basepython = python3.11
uv_resolution = lowest-direct
# pins rich, requests and markdown-it-py to their lower bounds, which a
# dependency otherwise lifts, see the file
setenv =
    UV_OVERRIDE = {toxinidir}/lowest-overrides.txt
# the resolution applies to the test runner as well, which has to stay current
deps =
    pytest>=9.1.1
    typst>=0.15.0

[testenv:julia]
# the generated julia code, run with julia and the packages it uses: julia on the
# path (or the command of `SBMLUTILS_JULIA`, e.g. a docker run) with the environment
# `tests/converters/ode/julia/Project.toml` instantiated and active (`JULIA_PROJECT`),
# see the `julia` job of `.github/workflows/ci-cd.yml`. The julia tests skip without
# julia elsewhere, here a missing julia fails them. Not part of `envlist`, it needs
# the toolchain.
basepython = python3.14
passenv =
    SBMLUTILS_JULIA
    JULIA_DEPOT_PATH
    JULIA_PROJECT
    JULIA_LOAD_PATH
    HOME
setenv =
    SBMLUTILS_REQUIRE_TOOLCHAINS = 1
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/converters/ode/test_ode_julia.py tests/converters/ode/test_ode_testsuite.py tests/converters/ode/test_ode_printers.py tests/converters/ode/test_ode_safety.py -k julia}

[testenv:R]
# the generated R code, run with Rscript and deSolve: Rscript on the path (or the
# command of `SBMLUTILS_RSCRIPT`, e.g. a docker run of the image of
# `tests/converters/ode/docker/r.Dockerfile`) with the package deSolve installed,
# see the `R` job of `.github/workflows/ci-cd.yml`. The R tests skip without R
# elsewhere, here a missing R fails them. Not part of `envlist`, it needs the
# toolchain.
basepython = python3.14
passenv =
    SBMLUTILS_RSCRIPT
    R_LIBS_USER
    R_LIBS_SITE
    HOME
setenv =
    SBMLUTILS_REQUIRE_TOOLCHAINS = 1
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/converters/ode/test_ode_r.py tests/converters/ode/test_ode_testsuite.py tests/converters/ode/test_ode_printers.py tests/converters/ode/test_ode_safety.py -k "test_r_ or [r- or [r]"}

[testenv:latex]
# the documents of the ODE export compiled, LaTeX with tectonic and typst with the
# typst package: tectonic on the path, see the `latex` job of
# `.github/workflows/ci-cd.yml`. The LaTeX compilations skip without tectonic
# elsewhere, here a missing tectonic or typst fails them. Not part of `envlist`, it
# needs the toolchain.
basepython = python3.14
deps =
    pytest
    typst>=0.15.0
passenv =
    HOME
setenv =
    SBMLUTILS_REQUIRE_TOOLCHAINS = 1
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/converters/ode/test_ode_presentation.py tests/converters/ode/test_ode_printers.py::test_latex_compiles tests/converters/ode/test_ode_printers.py::test_typst_compiles tests/converters/ode/test_ode_symbols.py::test_typst_symbols_compile}
