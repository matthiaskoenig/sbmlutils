[tox]
envlist = ty, cobra, lowest, py3.{11,12,13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
# the examples simulate and plot, the package itself does neither
extras =
    examples
deps =
    pytest
# what follows `--` is passed to pytest, so that `tox r -e py3.14 --
# tests/test_factory.py` runs one module in the environment; without it the
# whole suite runs, which is what continuous integration does
commands =
    pytest -m "not sbml_testsuite" {posargs}

[testenv:py3.15]
# libroadrunner has no CPython 3.15 wheels yet. Test the core package while
# simulation tests skip; older Python environments still run the full suite.
extras =
deps =
    pytest
    matplotlib>=3.11.1

[testenv:ty]
# the examples simulate and plot, and `sbmlutils.cytoscape` imports
# py4cytoscape, all of them have to resolve for the type check
extras =
    cytoscape
    examples
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check

[testenv:cobra]
# the tests which need cobrapy, the optional `cobra` extra: the fbc semantics
# of `tests/test_package_semantics.py`, which reads a model and its round trip
# as two constraint based models, and `tests/fbc/test_cobra.py`. Both skip when
# cobrapy is absent, so without this environment they would skip everywhere and
# verify nothing. The environments above deliberately do not install it: the
# package works without it, and the type check is run against a tree in which
# it is missing. `examples` is needed as well, the comp semantics of the same
# module simulate with roadrunner.
#
# cobrapy 0.32.1 and its glpk solver install and run on python 3.14, which this
# environment is pinned to. It is part of `envlist`, which requires 3.14 already.
basepython = python3.14
extras =
    cobra
    examples
deps =
    pytest
# what follows `--` replaces the two modules below, so that
# `tox r -e cobra -- tests/fbc/test_cobra.py` runs that one
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/test_package_semantics.py tests/fbc/test_cobra.py}

[testenv:lowest]
# the lower bounds of `pyproject.toml` are a promise to every user who installs
# sbmlutils next to other packages: this environment installs the oldest
# version each of them allows (`lowest-direct`, the dependencies of those stay
# at their newest) on the oldest supported python and runs the suite against it
basepython = python3.11
uv_resolution = lowest-direct
# pins rich, requests and markdown-it-py to their lower bounds, which a
# dependency otherwise lifts, see the file
setenv =
    UV_OVERRIDE = {toxinidir}/lowest-overrides.txt
# the resolution applies to the test runner as well, which has to stay current
deps =
    pytest>=9.1.1

[testenv:julia]
# the generated julia code, run with julia and the packages it uses: julia on the
# path (or the command of `SBMLUTILS_JULIA`, e.g. a docker run) with OrdinaryDiffEq,
# DataFrames, NaNMath and SpecialFunctions in its environment, see the `julia` job
# of `.github/workflows/ci-cd.yml`. The julia tests skip without julia elsewhere,
# here a missing julia fails them. Not part of `envlist`, it needs the toolchain.
basepython = python3.14
passenv =
    SBMLUTILS_JULIA
    JULIA_DEPOT_PATH
    HOME
setenv =
    SBMLUTILS_REQUIRE_TOOLCHAINS = 1
commands =
    pytest -m "not sbml_testsuite" {posargs:tests/converters/ode/test_ode_julia.py tests/converters/ode/test_ode_testsuite.py tests/converters/ode/test_ode_printers.py -k julia}
