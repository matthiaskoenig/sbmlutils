[tox]
envlist = ty, lowest, py3.{12,13,14,15}

[testenv]
package = wheel
wheel_build_env = .pkg
# the examples simulate and plot, the package itself does neither
extras =
    examples
deps =
    pytest
    pytest-xdist
# what follows `--` is passed to pytest, so that `tox r -e py3.14 --
# tests/test_factory.py` runs one module in the environment; without it the
# whole suite runs. Continuous integration passes `-n auto` (pytest-xdist) and
# deselects the `slow` tests, which run locally only, see ci-cd.yml
commands =
    pytest -m "not sbml_testsuite" {posargs}

[testenv:py3.15]
# libroadrunner has no CPython 3.15 wheels yet, so the `examples` extra is not
# installed. Test the core package while the roadrunner tests skip; older Python
# environments still run the full suite. The rest of the extra installs:
# matplotlib runs the plotting examples.
extras =
deps =
    pytest
    pytest-xdist
    matplotlib>=3.11.1

[testenv:ty]
# the simulation and plotting imports in the examples must resolve
extras =
    examples
passenv =
    TY_OUTPUT_FORMAT
deps =
    ty
    pytest
commands =
    ty check

[testenv:lowest]
# the lower bounds of `pyproject.toml` are a promise to every user who installs
# sbmlutils next to other packages: this environment installs the oldest
# version each of them allows (`lowest-direct`, the dependencies of those stay
# at their newest) on the oldest supported python and runs the suite against it
basepython = python3.12
uv_resolution = lowest-direct
# pins rich, requests and markdown-it-py to their lower bounds, which a
# dependency otherwise lifts, see the file
setenv =
    UV_OVERRIDE = {toxinidir}/lowest-overrides.txt
# the resolution applies to the test runner as well, which has to stay current
deps =
    pytest>=9.1.1
    pytest-xdist>=3.8.0
