[project]
site_name = "sbmlutils"
site_url = "https://matthiaskoenig.github.io/sbmlutils/"
site_description = "Python utilities for the Systems Biology Markup Language (SBML)"
site_author = "Matthias König"

copyright = 'Copyright &copy; 2017-2026 <a href="https://livermetabolism.com">Matthias König</a>'

repo_url = "https://github.com/matthiaskoenig/sbmlutils"
repo_name = "matthiaskoenig/sbmlutils"
edit_uri = "edit/develop/docs/"

# math (`$...$`, `$$...$$`) is typeset by MathJax, see `pymdownx.arithmatex`
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js",
]
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "User guide" = [
    { "Model creation" = "creation.md" },
    { "Units" = "units.md" },
    { "Annotations" = "annotations.md" },
    { "Notes" = "notes.md" },
    { "Validation" = "validation.md" },
    { "Reading and writing" = "io.md" },
    { "Model composition" = "comp.md" },
    { "Flux balance constraints" = "fbc.md" },
    { "Distributions and uncertainties" = "distrib.md" },
    { "COMBINE archives" = "omex.md" },
    { "Reports" = "reports.md" },
    { "Converters" = "converters.md" },
    { "ODE export" = "ode.md" },
    { "Interpolation" = "interpolation.md" },
    { "Visualization" = "visualization.md" },
  ] },
  { "References" = "references.md" },
  { "API reference" = [
    { "Overview" = "api/index.md" },
    { "sbmlutils" = [
      { "factory" = "api/factory.md" },
      { "io" = "api/io.md" },
      { "validation" = "api/validation.md" },
      { "parser" = "api/parser.md" },
      { "notes" = "api/notes.md" },
      { "reaction_equation" = "api/reaction_equation.md" },
      { "biomodels" = "api/biomodels.md" },
      { "cytoscape" = "api/cytoscape.md" },
      { "console" = "api/console.md" },
      { "log" = "api/log.md" },
      { "utils" = "api/utils.md" },
    ] },
    { "sbmlutils.comp" = [
      { "comp" = "api/comp.comp.md" },
      { "flatten" = "api/comp.flatten.md" },
    ] },
    { "sbmlutils.converters" = [
      { "ode" = "api/converters.ode.md" },
      { "xpp" = "api/converters.xpp.md" },
      { "copasi" = "api/converters.copasi.md" },
    ] },
    { "sbmlutils.data" = [
      { "interpolation" = "api/data.interpolation.md" },
    ] },
    { "sbmlutils.fbc" = [
      { "fbc" = "api/fbc.fbc.md" },
      { "cobra" = "api/fbc.cobra.md" },
    ] },
    { "sbmlutils.layout" = [
      { "layout" = "api/layout.layout.md" },
    ] },
    { "sbmlutils.manipulation" = [
      { "merge" = "api/manipulation.merge.md" },
    ] },
    { "sbmlutils.metadata" = [
      { "annotator" = "api/metadata.annotator.md" },
      { "validator" = "api/metadata.validator.md" },
      { "miriam" = "api/metadata.miriam.md" },
    ] },
    { "sbmlutils.report" = [
      { "sbmlinfo" = "api/report.sbmlinfo.md" },
      { "sbmlreport" = "api/report.sbmlreport.md" },
      { "units" = "api/report.units.md" },
      { "mathml" = "api/report.mathml.md" },
    ] },
  ] },
  { "Contributing" = "development.md" },
]

[project.theme]
language = "en"
favicon = "images/favicon/favicon.ico"
logo = "images/favicon/sbmlutils-100x100.png"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/sbmlutils"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/sbmlutils/"

# `docs/superpowers` holds internal design documents, `docs/images/ode` the
# files of the ODE export which `ode.md` includes, neither is a page
[project.plugins.exclude]
glob = ["superpowers/*", "images/ode/*.md"]

# API reference is rendered from the docstrings, see the `docs/api` pages
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = false
# the page provides the heading, see the `docs/api` pages
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# `--8<-- "images/ode/repressilator.py"` includes a file of `docs`, a missing one
# fails the build
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
